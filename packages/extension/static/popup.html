<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rsdoctor Trace</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="mark" aria-hidden="true">R</div>
        <div>
          <h1>Rsdoctor Trace</h1>
          <p>Chrome runtime evidence</p>
        </div>
        <span id="status-dot" class="status-dot" aria-hidden="true"></span>
      </header>

      <section class="panel" aria-labelledby="receiver-heading">
        <div class="section-title">
          <h2 id="receiver-heading">Local receiver</h2>
          <button id="check-receiver" class="text-button" type="button">Check</button>
        </div>
        <label for="receiver-url">Endpoint</label>
        <input
          id="receiver-url"
          name="receiver-url"
          type="url"
          value="http://127.0.0.1:43119"
          spellcheck="false"
          autocomplete="off"
        />
        <p id="receiver-status" class="hint">Start the receiver before capturing.</p>
      </section>

      <section class="panel" aria-labelledby="capture-heading">
        <h2 id="capture-heading">Capture</h2>
        <fieldset>
          <legend>Mode</legend>
          <label class="mode-option">
            <input type="radio" name="mode" value="authenticated-reload" checked />
            <span>
              <strong>Reload page</strong>
              <small>Best for LCP, loading, and network waterfalls.</small>
            </span>
          </label>
          <label class="mode-option">
            <input type="radio" name="mode" value="current-state-interaction" />
            <span>
              <strong>Current state</strong>
              <small>Use while reproducing a post-load interaction.</small>
            </span>
          </label>
        </fieldset>

        <div class="actions">
          <button id="start" class="primary" type="button">Start capture</button>
          <button id="stop" class="danger" type="button" disabled>Stop</button>
        </div>
      </section>

      <section class="capture-status" aria-live="polite">
        <span id="phase">Idle</span>
        <p id="message">Ready to capture the active tab.</p>
        <code id="capture-id" hidden></code>
      </section>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
